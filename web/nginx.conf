# ---------------------------------------------------------------------------
# nginx serves the built client and proxies the API.
#
# Putting both behind one origin means the browser never makes a cross-origin
# request, so there are no CORS preflights and no origin list to keep in sync
# with the deployment.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The client is a single-page application: every unknown path is a route it
    # handles itself, so unmatched requests fall back to index.html rather than
    # returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames make these safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # `api` is the service name on the compose network.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
